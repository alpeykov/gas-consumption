<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gas Consumption – Changelog</title>
<meta name="description" content="Every release of the Gas Consumption app, newest first, with the changes made since closed testing began.">
<link rel="icon" href="icons/favicon-64-v2.png">
<style>
  :root { --bg: #0f141a; --panel: #18202a; --fg: #e6edf3; --muted: #9aa7b4; --line: #2a3542; --flame: #6ea8ff; color-scheme: dark; }
  @media (prefers-color-scheme: light) { :root { --bg: #f5f7fa; --panel: #ffffff; --fg: #18202a; --muted: #55606c; --line: #d5dce4; --flame: #1f5fcf; color-scheme: light; } }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 720px; margin: 0 auto; padding: 24px max(16px, env(safe-area-inset-right, 0px)) 48px max(16px, env(safe-area-inset-left, 0px)); }
  h1 { font-size: 1.5rem; margin: 0 0 4px; }
  h2 { font-size: 1rem; margin: 0; display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
  h2 .muted { font-weight: 400; }
  .muted { color: var(--muted); font-size: 0.9rem; }
  .summary { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px 20px; margin-top: 20px; }
  ol { list-style: none; padding: 0; margin: 20px 0 0; display: grid; gap: 12px; }
  ol > li { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px 20px; }
  ol > li.start { border-color: var(--flame); }
  ul { margin: 6px 0 0; padding-left: 20px; }
  a { color: var(--flame); }
  nav { display: flex; gap: 16px; margin-top: 8px; }
</style>
</head>
<body>
<main>
  <h1>Gas Consumption – Changelog</h1>
  <p class="muted">Every release of the app, newest first. The Android app shows this web app, so each release reaches Android users as soon as it is published.</p>
  <nav><a href="./">Open the app</a><a href="privacy.html">Privacy</a></nav>
  <div class="summary" id="summary">Loading…</div>
  <ol id="list"></ol>
</main>
<script>
  // Closed testing on Google Play started with this release (19 October 2026).
  const TEST_START = "1.9.7";
  const newer = (a, b) => { const x = a.split(".").map(Number), y = b.split(".").map(Number);
    for (let i = 0; i < Math.max(x.length, y.length); i++) if ((x[i] || 0) !== (y[i] || 0)) return (x[i] || 0) > (y[i] || 0);
    return false; };
  const date = (iso) => new Date(iso + "T12:00:00").toLocaleDateString("en-GB", { day: "numeric", month: "long", year: "numeric" });
  const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
  fetch("data/changelog.json", { cache: "no-cache" }).then((r) => r.json()).then(({ versions }) => {
    const since = versions.filter((v) => newer(v.version, TEST_START));
    const start = versions.find((v) => v.version === TEST_START);
    const sum = document.getElementById("summary");
    sum.textContent = "";
    sum.append(el("strong", null, since.length + " releases since closed testing began"),
      document.createTextNode(" – from version " + TEST_START + (start ? " (" + date(start.date) + ")" : "") + " to version " + versions[0].version + " (" + date(versions[0].date) + ")."));
    const list = document.getElementById("list");
    for (const v of versions) {
      const li = el("li", v.version === TEST_START ? "start" : "");
      const h = el("h2", null, "Version " + v.version);
      h.append(el("span", "muted", date(v.date) + (v.version === TEST_START ? " · closed testing started" : "")));
      const ul = el("ul");
      for (const line of v.en) ul.append(el("li", null, line));
      li.append(h, ul);
      list.append(li);
    }
  }).catch(() => { document.getElementById("summary").textContent = "The changelog could not be loaded."; });
</script>
</body>
</html>
